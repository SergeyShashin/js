<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <style>
    * {
      margin: 0 auto;
      text-align: center;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: rgba(32, 178, 170, 0.5);
    }

    #gallery {}

    #gallery img {
      border-radius: 20px;
    }

    #galleryMinSize {
      height: 30vh;
      position: fixed;
      bottom: 0;
      overflow-y: scroll;
      /* overflow-y: hidden; */
      z-index: 1;
    }

    #galleryMinSize img {
      cursor: pointer;
      margin: 10px;
    }

    #galleryMaxSize {
      position: absolute;
      background: rgba(32, 178, 170, 0.5);
      width: 100%;
      height: 100vh;
      padding: 20px;
    }

    #galleryMaxSize img {
      position: relative;
      width: 800px;
      z-index: 2;
    }

    #btnClose {
      display: block;
      position: absolute;
      width: 50px;
      height: 50px;
      background: none;
      top: 0;
    }
  </style>
  <title>Gallery</title>
</head>

<body>
  <section id='gallery'>
    <article id='galleryMaxSize'>
      <img src='img\max\1.jpg' alt='1.jpg'>
    </article>
    <article id='galleryMinSize'>
      <img src='img\min\1.jpg' alt='1.jpg' data-max-size='img\max\1.jpg'>
      <img src='img\min\2.jpg' alt='2.jpg' data-max-size='img\max\2.jpg'>
      <img src='img\min\3.jpg' alt='3.jpg' data-max-size='img\max\3.jpg'>
      <img src='img\min\4.jpg' alt='4.jpg' data-max-size='img\max\4.jpg'>
      <img src='img\min\1.jpg' alt='1.jpg' data-max-size='img\max\1.jpg'>
      <img src='img\min\1.jpg' alt='1.jpg' data-max-size='img\max\1.jpg'>
    </article>
  </section>
</body>

</html>
